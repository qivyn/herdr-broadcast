purpose:
  stands_in_for: GitHub Release metadata reads, Git tag creation, draft releases, asset uploads and stable publication.
  unblocks: Offline verification of the updater and CI publisher without GitHub credentials or real releases.
assumptions:
  - id: stable-release-metadata
    status: supported
    claim: The latest release endpoint returns a published non-draft, non-prerelease release; target_commitish may be a branch name.
    reason: GitHub's documented contract specifies these properties. The caller still validates the response and resolves the tag using Git.
    verification: Read the official GitHub REST contract on 2026-10-30. Ran scripts/check-release-api.ts with Postman CLI 1.77.0: 7 scenarios passed; 9 real HTTP requests were observed in the simulation log. This verifies caller behavior against synthetic responses, not a live release installation. The owner mock search was skipped because the CLI is signed out; this local mock follows the official contract.
    source: https://docs.github.com/en/rest/releases/releases#get-the-latest-release
    updated_at: "2026-10-30"
  - id: ci-publication-and-recovery
    status: supported
    claim: Publication uses a tested commit tag, uploads binary assets to a draft, and makes it a stable latest release only after uploads succeed. A failed response may follow a successful publication.
    reason: GitHub's documented refs, releases and assets contracts support these operations. The caller checks published versions before writing, checks tag ownership, and resumes only drafts marked with the same CI commit and run ID.
    verification: On 2026-10-30 the real publisher ran against the local Postman mock. Four publication scenarios passed including an unchanged-version repeat, an upload 502 followed by recovery, a publication 503 after the state changed followed by a read-only repeat, and a conflicting tag with no writes. Together with the seven updater scenarios, the log contained 47 modeled GitHub HTTP requests, 19 writes and five local state observations. These checks establish caller behavior against synthetic responses; no real GitHub tag or Release was created. Owner mock discovery remains skipped while signed out. Orbit supplied the upload endpoint brief; official GitHub documentation supplied the missing create/publish/auth contract. The mock interceptor consumes request streams, so its handler uses req.body.
    source: scripts/publish-release.ts; scripts/check-release-api.ts; test/release-publish.test.ts; https://docs.github.com/en/rest/releases/releases; https://docs.github.com/en/rest/releases/assets; https://docs.github.com/en/rest/git/refs
    updated_at: "2026-10-30"
  - id: missing-release-versus-repository
    status: supported
    claim: A 404 from the latest release endpoint alone does not establish that the repository has no releases.
    reason: Missing or inaccessible repositories also return 404. The caller requires a successful public repository read before treating the result as no stable release.
    verification: On 2026-10-30 the real client received latest=404 then repository=200 and returned no release; latest=404 then repository=404 remained an error. Rate limit, upstream failure, invalid prerelease metadata and timeout also rejected the check. Public GitHub documentation permits unauthenticated reads; the generic Orbit brief described optional bearer authentication from its example collection.
    source: src/service/github-release.ts; test/github-release.test.ts; https://docs.github.com/en/rest/releases/releases#get-the-latest-release
    updated_at: "2026-10-30"
