<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Herdr 广播</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root {
    --bg: #faf9f5; --sidebar: #f3f1ea; --surface: #ffffff; --surface-2: #f0eee6; --bubble: #efece3;
    --line: #e6e3d9; --line-strong: #d5d1c4; --text: #1f1e1d; --text-2: #6b6962; --text-3: #9a978d;
    --accent: #c96442; --accent-hover: #b4573a; --accent-soft: rgba(201, 100, 66, .10); --on-accent: #fff;
    --ok: #4f7d5b; --run: #3f6e92; --ask: #a8681a; --bad: #b5463b;
    --term-bg: #1d1c1a; --term-text: #e6e3d9;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "STSong", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* the agents' screens: a terminal face whose box-drawing lines meet, with CJK beside it */
    --term-font: "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
    --shadow: 0 1px 2px rgba(31, 30, 29, .05), 0 4px 16px rgba(31, 30, 29, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262624; --sidebar: #1f1e1d; --surface: #30302e; --surface-2: #383734; --bubble: #3a3936;
      --line: #3b3a37; --line-strong: #4a4945; --text: #f0eee6; --text-2: #a8a59b; --text-3: #7d7a72;
      --accent: #d97757; --accent-hover: #e2896b; --accent-soft: rgba(217, 119, 87, .14);
      --ok: #8dbb8f; --run: #86b3d6; --ask: #e0a95b; --bad: #e08377;
      --term-bg: #1a1918;
      --shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 6px 20px rgba(0, 0, 0, .15);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---- frame ---- */
  .app { display: grid; grid-template-columns: 248px 1fr; height: 100%; }
  .sidebar { background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .sidebar-top { padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 2px 6px; font-family: var(--serif); font-size: 17px; }
  .brand .brand-side { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
  .brand .bell { border: 0; background: transparent; padding: 3px 5px; border-radius: 7px; font-size: 13px; line-height: 1; font-family: var(--sans); }
  .brand .bell:hover { background: var(--surface-2); }
  .brand .bell.off { opacity: .55; }
  /* the page's own link to this server: said only when it is lost (the banner says the rest) */
  /* every machine, quiet while it answers, red when it does not */
  /* the machines entry: beside 新建广播, the machines named under it, red when one does not answer */
  .nav-machines { margin-top: -6px; align-items: flex-start; }
  .nav-machines .icon { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); background: var(--surface-2); flex: none; }
  .nav-machines:hover .icon, .nav-machines.current .icon { background: var(--surface); }
  .nav-text { display: flex; flex-direction: column; min-width: 0; line-height: 22px; }
  .nav-machines-list { display: flex; flex-wrap: wrap; gap: 0 10px; font-size: 12px; line-height: 1.5; color: var(--text-3); }
  .nav-machines-list:empty { display: none; }
  .nav-machines-list .m { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; }
  .nav-machines-list .m span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-machines-list .m.down { color: var(--bad); font-weight: 500; }
  .nav-machines-list .m.off span { text-decoration: line-through; }
  .nav-machines-list .m .dot { width: 7px; height: 7px; }
  .new-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--text); text-align: left; }
  .new-btn:hover, .new-btn.current { background: var(--surface-2); }
  .new-btn .plus { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 16px; line-height: 1; }
  .sidebar-list { overflow: auto; padding: 4px 8px 16px; flex: 1; }
  .search { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 6px 10px; font-size: 13px; outline: 0; }
  .search:focus { border-color: var(--line-strong); }
  .group { margin-top: 14px; padding: 0 10px 4px; color: var(--text-3); font-size: 12px; }
  .task { border-radius: 10px; }
  .task-row { display: grid; grid-template-columns: 8px 1fr; column-gap: 9px; align-items: center; width: 100%; padding: 7px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; color: var(--text); }
  .task-row:hover { background: var(--surface-2); }
  .task-row.current { background: var(--surface-2); }
  .task-row .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-row .n { grid-column: 2; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--text-3); }
  /* color only where a look is wanted: running, waiting, failed. Done and fine stay quiet: a grey ring */
  .dot.ok { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); } .dot.run { background: var(--run); } .dot.ask { background: var(--ask); } .dot.bad { background: var(--bad); }
  .dot.run { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.run { animation: none; } }
  .c-ok { color: var(--text-2); } .c-run { color: var(--run); } .c-ask { color: var(--ask); } .c-bad { color: var(--bad); } .c-dim { color: var(--text-3); }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 52px; }
  .topbar .title { font-family: var(--serif); font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .spacer { flex: 1; }
  .back { display: none; border: 0; background: transparent; color: var(--text-2); padding: 4px 6px; border-radius: 8px; }
  .back:hover { background: var(--surface-2); }
  .scroll { flex: 1; overflow: auto; min-height: 0; }
  .column { max-width: 780px; margin: 0 auto; padding: 8px 24px 40px; }

  /* ---- buttons ---- */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 13px; }
  .btn:hover:not(:disabled) { background: var(--surface-2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--text-2); }
  .btn.quiet:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }

  /* ---- composer ---- */
  .composer { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 20px; box-shadow: var(--shadow); padding: 12px 12px 10px 16px; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line-strong)); }
  .composer textarea { display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent; font: 15px/1.6 var(--sans); min-height: 52px; max-height: 40vh; padding: 2px 0; }
  .composer textarea::placeholder { color: var(--text-3); }
  .composer-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
  .composer-foot .spacer { flex: 1; }
  .send { width: 34px; height: 34px; flex: none; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .send:hover:not(:disabled) { background: var(--accent-hover); }
  .send:disabled { background: var(--line-strong); color: var(--surface); cursor: default; }
  .pill { border: 1px solid var(--line); background: transparent; color: var(--text-2); border-radius: 999px; padding: 2px 10px; font: 12px/1.6 var(--mono); }
  .pill:hover { border-color: var(--line-strong); color: var(--text); background: var(--surface-2); }
  .hint { color: var(--text-3); font-size: 12px; }

  /* ---- new broadcast ---- */
  .hero { font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1.25; text-align: center; margin: 0 0 12px; letter-spacing: -.01em; }
  .hero-mark { width: 34px; height: 34px; margin-right: 12px; vertical-align: -5px; border-radius: 9px; }
  .hero-sub { text-align: center; color: var(--text-2); margin: 0; }
  .new-column { width: 100%; max-width: 760px; padding-top: clamp(32px, 12vh, 130px); }
  .new-hero { margin-bottom: 30px; }
  .new-column .composer { padding: 18px 16px 12px 20px; }
  .new-column .composer textarea { min-height: 76px; }
  .recipient-picker { margin-top: 24px; }
  .kind-select { border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 4px 28px 4px 10px; font-size: 12px; min-width: 128px; }

  .title-input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0; font-size: 13px; color: var(--text); outline: 0; }
  .title-input::placeholder { color: var(--text-3); }
  /* the title, asked for only when wanted: a labelled line above the prompt */
  .title-row { display: flex; align-items: center; gap: 10px; padding: 0 0 6px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
  .title-row > span { color: var(--text-3); font-size: 12px; flex: none; }
  .title-toggle { border: 0; background: transparent; color: var(--text-3); font-size: 12px; padding: 3px 8px; margin-left: -8px; border-radius: 7px; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title-toggle:hover { background: var(--surface-2); color: var(--text-2); }
  .tchips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0 0 8px; }
  .tchips .to { color: var(--text-3); font-size: 12px; margin-right: 2px; }
  .tchip { display: inline-flex; align-items: center; gap: 2px; border-radius: 7px; padding: 1px 2px 1px 8px; font-size: 12px; line-height: 1.6; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); max-width: 100%; }
  .tchip.fresh { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .tchip.bad { background: color-mix(in srgb, var(--bad) 10%, transparent); border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); }
  .tchip button { border: 0; background: transparent; color: inherit; opacity: .55; padding: 0 5px; border-radius: 5px; font-size: 13px; line-height: 1.2; }
  .tchip button:hover { opacity: 1; background: color-mix(in srgb, currentColor 12%, transparent); }
  .ws-head { display: flex; align-items: center; gap: 8px; padding: 7px 14px 5px; background: var(--surface-2); color: var(--text-2); font-size: 12px; border-top: 1px solid var(--line); }
  .panel-head + .ws-head { border-top: 0; }
  .ws-head .spacer { flex: 1; }
  .ws-head .btn { padding: 1px 8px; font-size: 12px; }
  .section { margin-top: 30px; }
  .section.first { margin-top: 10px; }
  /* machines: a list, and adding one in a small form above it */
  .health-note { color: var(--text-3); font-size: 12px; }
  .health-note.bad { color: var(--bad); }
  .state-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap; background: var(--surface-2); color: var(--text-3); }
  .state-pill.c-ok { color: var(--text-2); }
  .state-pill.c-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .mlist .mrow { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; padding: 10px 14px; }
  .mlist .mrow + .mrow { border-top: 1px solid var(--line); }
  .mlist .mmain { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .mlist .mname { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mlist .mrow.off .mname { color: var(--text-3); text-decoration: line-through; }
  .mlist .maddr { font: 12px var(--mono); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mlist .mmeta { color: var(--text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .machine-webui { align-self: flex-start; margin-top: 3px; padding: 0; border: 0; background: transparent; color: var(--accent); font-size: 12px; line-height: 1.6; text-decoration: none; }
  .machine-webui:hover { text-decoration: underline; }
  .machine-webui:disabled { color: var(--text-3); cursor: default; text-decoration: none; }
  .mlist .mopen { display: inline-flex; gap: 14px; align-items: center; }
  .webui-tip { margin: 0 0 10px; color: var(--text-3); font-size: 12px; }
  .webui-tip a { color: var(--accent); }
  .about { margin: 18px 0 8px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; }
  .about .about-version { font: 12px var(--mono); color: var(--text-2); }
  .about .about-state { color: var(--text-2); font-size: 12px; }
  .about .about-state.bad { color: var(--bad); }
  .about .about-state.new { color: var(--accent); font-weight: 500; }
  .about .btn { padding: 3px 10px; font-size: 12px; }
  .about .spacer { flex: 1; }
  .settings-nav { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .settings-nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; color: var(--text-2); }
  .settings-nav button:hover, .settings-nav button.current { background: var(--surface-2); color: var(--text); }
  .update-box { margin-left: auto; color: var(--accent); font-size: 11px; }
  .settings-column { padding-top: 28px; }
  .settings-title { margin: 0 0 6px; font: 28px var(--serif); }
  .settings-heading { margin: 30px 0 10px; font-size: 14px; font-weight: 600; }
  .about { margin: 0; padding: 16px; }
  .about .about-state { flex-basis: 100%; order: 1; }
  .service-panel { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .service-panel strong { font-size: 13px; font-weight: 500; }
  .service-panel p { margin: 5px 0 0; }
  .service-panel .btn { flex: none; }
  .service-help { margin-top: 18px; color: var(--text-2); font-size: 12px; }
  .service-help summary { cursor: pointer; }
  .service-help code { display: block; overflow-wrap: anywhere; padding: 10px; border-radius: 6px; background: var(--surface-2); }
  .mlist .mactions { display: inline-flex; gap: 1px; opacity: .55; transition: opacity .15s; }
  .mlist .mrow:hover .mactions, .mlist .mrow:focus-within .mactions { opacity: 1; }
  .mlist .mactions .btn { padding: 3px 9px; font-size: 12px; }
  .mlist .danger { color: var(--bad); }
  .mlist .rename { display: flex; gap: 6px; align-items: center; }
  .mlist .rename input { flex: 1; min-width: 0; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 5px 9px; font: 13px var(--sans); color: var(--text); }
  .mlocal { padding: 0 8px; color: var(--text-3); font-size: 12px; }
  .imports, .mrow.import { display: none; }
  .import-note { margin: 12px 0 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); display: flex; flex-direction: column; gap: 10px; }
  .import-head { display: flex; flex-direction: column; gap: 2px; }
  .import-head .sub { margin: 0; font-size: 12px; }
  .import-list { display: flex; flex-direction: column; gap: 6px; }
  .import-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; background: var(--surface); }
  .import-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .import-main code { font: 12px var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .import-main .wsub, .import-main .wnote { margin: 0; font-size: 12px; }
  /* adding: a small form, then a line of steps with the one in hand open under it */
  .add-panel { margin: 12px 0 16px; padding: 10px 14px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .add-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 500; font-size: 13px; color: var(--text-2); }
  .add-head .spacer { flex: 1; }
  .add-head .btn { padding: 1px 8px; font-size: 12px; }
  .topbar .btn.on { background: var(--surface-2); }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; padding: 0; list-style: none; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--text-3); }
  .chip.done { color: var(--text-2); }
  .chip.now { background: var(--accent); color: var(--on-accent); font-weight: 500; }
  .chip .tick { font-size: 11px; }
  .step-body { display: flex; flex-direction: column; gap: 8px; }
  .wrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .winput { flex: 1 1 220px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 10px; font: 13px var(--mono); color: var(--text); min-width: 0; }
  .winput.port { flex: 0 0 84px; }
  .winput.short { flex: 0 1 180px; font-family: var(--sans); }
  .wnote { margin: 0; color: var(--text-2); font-size: 13px; }
  .wnote.warn { color: var(--ask); }
  .wnote.bad { color: var(--bad); }
  .wnote code, .step-body code { font: 12px var(--mono); background: var(--surface-2); border-radius: 5px; padding: 1px 5px; }
  .wsub { margin: 0; font-size: 12px; color: var(--text-3); }
  .plan { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 13px; }
  .prints { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .prints .ktype { display: inline-block; min-width: 92px; color: var(--text-3); font-size: 12px; }
  .copy-block { display: flex; gap: 8px; align-items: flex-start; }
  .copy-block pre, .wout { flex: 1; min-width: 0; margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--term-bg); color: var(--term-text); font: 12px/1.5 var(--term-font); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; }
  .question { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--ask) 9%, transparent); }
  .question .wnote code { white-space: normal; }
  .diagnosis { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 7%, transparent); }
  .diagnosis ul { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 13px; }
  .diagnosis .btn { margin-top: 4px; }
  .wdone { padding: 4px 0 2px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .wdone p { margin: 0; }
  details summary { cursor: pointer; color: var(--text-3); font-size: 12px; }
  progress { width: 100%; height: 6px; accent-color: var(--accent); }
  @media (max-width: 640px) {
    .mlist .mrow { grid-template-columns: 8px minmax(0, 1fr) auto; }
    .mlist .mstate { grid-column: 2; }
    .mlist .mactions { grid-column: 2 / 4; opacity: 1; justify-content: flex-start; }
  }
  details summary { cursor: pointer; color: var(--text-3); font-size: 12px; }
  /* who it goes to: new agents or running ones, one at a time */
  .tabs { display: flex; gap: 4px; margin: 22px 0 14px; border-bottom: 1px solid var(--line); }
  .tab { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 8px 12px 10px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--text-2); font-size: 14px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); font-weight: 500; border-bottom-color: var(--accent); }
  .tab-count { min-width: 18px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 500; line-height: 18px; text-align: center; }
  .tabpanel > .sub { color: var(--text-2); font-size: 13px; margin: 0 0 12px; }
  .section h2 { font-family: var(--serif); font-weight: 500; font-size: 18px; margin: 0 0 4px; }
  .section .sub { color: var(--text-2); font-size: 13px; margin: 0 0 12px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .panel + .panel { margin-top: 10px; }
  /* a machine that does not answer: said in red, what it had left greyed out of reach */
  .panel.down { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
  .panel.down .panel-head { color: var(--bad); }
  .panel.down .opt, .panel.down .ws-head, .panel.down .folder { opacity: .5; }
  .down-tag { display: inline-flex; align-items: center; border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 500; color: #fff; background: var(--bad); }
  .down-note { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); border-bottom: 1px solid var(--line); font-size: 13px; }
  .down-note .why { color: var(--text-3); font: 12px var(--mono); overflow-wrap: anywhere; }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 500; }
  .panel-head .spacer { flex: 1; }
  .panel-head .meta { color: var(--text-3); font-weight: 400; font-size: 12px; }
  .opt { display: grid; grid-template-columns: 20px 92px 1fr auto; gap: 10px; align-items: center; padding: 9px 14px; cursor: pointer; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt:hover { background: var(--surface-2); }
  .opt input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .opt .kind { font-weight: 500; }
  .opt .where { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt .where > span + span::before { content: "　"; }
  .opt .where .name { color: var(--text); }
  .opt .where .dir { font: 12px var(--mono); color: var(--text-2); }
  .opt .where .ttl { color: var(--text-3); }
  .search.filter { margin: 0 0 10px; padding: 7px 12px; background: var(--surface); font-size: 13px; }
  .opt .st { font-size: 12px; white-space: nowrap; }
  .newbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 12px; font-size: 13px; color: var(--text-2); }
  .folder { display: grid; grid-template-columns: minmax(80px, 170px) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 14px; }
  .folder + .folder, .more-dirs + .folder { border-top: 1px solid var(--line); }
  .folder .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder .path { color: var(--text-3); font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder .picks { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
  .folder.other { align-items: start; }
  .folder.other .name, .folder.other .picks { padding-top: 5px; }
  .other-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .other-field input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 9px; font: 12px var(--mono); }
  .suggest { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px; max-height: 260px; overflow: auto; }
  .sg { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 6px; padding: 4px 8px; text-align: left; font: 12px var(--mono); color: var(--text); }
  .sg:hover, .sg.on { background: var(--surface-2); }
  /* how many of a type a folder gets */
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; font-size: 12px; background: var(--surface); }
  .stepper .sk { align-self: stretch; display: grid; place-items: center; padding: 0 8px; color: var(--accent); background: var(--accent-soft); }
  .stepper button { width: 24px; height: 24px; border: 0; background: transparent; color: var(--text-2); font-size: 14px; line-height: 1; }
  .stepper button:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .stepper .sn { min-width: 18px; text-align: center; font-weight: 500; font-variant-numeric: tabular-nums; }
  .more-dirs { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 7px 14px; text-align: left; color: var(--text-2); font-size: 12px; }
  .more-dirs:hover { background: var(--surface-2); color: var(--text); }
  .nb-label { color: var(--text-2); margin-right: -10px; }
  .chip { border: 0; border-radius: 999px; padding: 2px 10px; font-size: 12px; background: var(--accent-soft); color: var(--accent); }
  .chip:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .plus1 { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 3px 10px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .plus1:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .plus1:disabled { opacity: .4; cursor: default; }
  .empty-note { padding: 14px; color: var(--text-3); font-size: 13px; }

  /* ---- a broadcast ---- */
  /* counts by state, kept in sight while the wall scrolls; each jumps to its agents */
  .summary { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 10px; background: var(--bg); }
  .summary:empty { display: none; }
  .sum { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 3px 12px 3px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .sum:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .top-actions { display: inline-flex; flex-wrap: wrap; gap: 2px; }
  .top-actions .btn { padding: 4px 9px; }
  .cards { display: grid; gap: 10px; }
  /* live terminal streams, side by side */
  .column.wide { max-width: none; padding-left: 28px; padding-right: 28px; }
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 640px), 1fr)); gap: 14px; }
  .screen-panel { display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; transition: box-shadow .2s; }
  .screen-panel.big { grid-column: 1 / -1; }
  .screen-panel.big .terminal-host { height: 72vh; }
  .screen-panel.ask { border-color: color-mix(in srgb, var(--ask) 60%, var(--line)); }
  .screen-panel.down { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
  .screen-panel.down .terminal-host { opacity: .55; }
  .screen-panel.focus { box-shadow: 0 0 0 2px var(--accent); }
  /* Agent identity leads; location is a quiet second line aligned with its name. */
  .screen-head { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; grid-template-areas: "pick who status" ". where actions"; gap: 2px 10px; align-items: center; padding: 10px 12px; }
  .screen-head .who { grid-area: who; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; min-width: 0; min-height: 28px; }
  .screen-head .who-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .screen-head .who-kind { flex: none; padding: 1px 7px; border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 12px; line-height: 20px; font-weight: 600; white-space: nowrap; }
  .screen-head .rename-agent { flex: none; opacity: .55; }
  .screen-head .rename-agent:hover, .screen-head .rename-agent:focus-visible { opacity: 1; }
  .rename-agent:disabled { opacity: .35; cursor: default; }
  .agent-rename { display: flex; flex-direction: column; gap: 6px; margin: 0 10px 10px; padding: 10px; border-radius: 8px; background: var(--surface-2); }
  .agent-rename .rename-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .agent-rename input { flex: 1 1 160px; min-width: 0; padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--text); font: 13px var(--mono); }
  .agent-rename .btn { padding: 4px 9px; font-size: 12px; }
  .agent-rename .rename-hint { color: var(--text-2); font-size: 12px; }
  .agent-rename .rename-error { color: var(--bad); font-size: 12px; }
  .screen-status { grid-area: status; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 8px; }
  .screen-status .dot { width: 6px; height: 6px; }
  .screen-head .state { font-size: 12px; white-space: nowrap; text-align: right; }
  .screen-head .where { grid-area: where; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .screen-head .machine-badge { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; color: var(--text); line-height: 22px; white-space: nowrap; }
  .screen-head .machine-icon { display: inline-flex; flex: none; color: var(--text-2); }
  .screen-head .machine-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 13px; font-weight: 600; }
  .screen-head .directory { flex: 1 2 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); font-size: 12px; }
  .screen-head .directory::before { content: "/"; margin-right: 8px; color: var(--text-3); }
  .screen-head .opens { grid-area: actions; display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .screen-head .opens .btn { height: 28px; padding: 0 8px; font-size: 12px; line-height: 1; border-radius: 6px; white-space: nowrap; }
  .screen-head { position: relative; }
  .screen-head .pick-box { grid-area: pick; display: flex; align-items: center; justify-content: center; width: 18px; height: 24px; }
  .screen-head .pick { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .screen-head .pick:disabled { cursor: default; opacity: .4; }
  .screen-panel.picked { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
  .webui-open { position: relative; display: inline-flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
  .webui-open .webui-label { padding: 0 6px; font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .screen-head .opens .webui-choice { border-color: transparent; background: transparent; }
  .screen-head .opens .webui-choice:hover { background: var(--surface); }
  .webui-help summary { display: grid; place-items: center; width: 26px; height: 28px; border-radius: 6px; list-style: none; font-size: 12px; font-weight: 500; }
  .webui-help summary::-webkit-details-marker { display: none; }
  .webui-help summary:hover, .webui-help[open] summary { background: var(--surface); color: var(--accent); }
  .webui-explainer { position: absolute; z-index: 6; top: calc(100% + 6px); right: 0; width: min(310px, calc(100vw - 76px)); padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); color: var(--text-2); font-size: 12px; line-height: 1.6; }
  .webui-explainer p { margin: 0 0 8px; }
  .webui-explainer p:last-child { margin-bottom: 0; }
  .webui-explainer strong { color: var(--text); margin-right: 8px; font-weight: 500; }
  .webui-explainer .webui-explainer-title { color: var(--text); font-weight: 500; }
  .webui-explainer .webui-explainer-foot { padding-top: 8px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 11px; }
  @media (max-width: 600px) {
    .screen-head { grid-template-areas: "pick who status" ". where where" ". actions actions"; }
    .screen-head .opens { padding-top: 3px; }
  }
  /* typing into an agent's terminal */
  .terminal-body { position: relative; min-width: 0; }
  .terminal-host { height: 380px; margin: 0 10px 10px; padding: 10px; border-radius: 10px; background: #1d1c1a; color-scheme: dark; overflow: hidden; }
  .screen-panel.inactive .terminal-host { height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; }
  .terminal-host .xterm { height: 100%; }
  .terminal-host .xterm-viewport { scrollbar-width: thin; scrollbar-color: #514e48 #1d1c1a; }
  .terminal-host .xterm-viewport::-webkit-scrollbar { width: 6px; height: 6px; }
  .terminal-host .xterm-viewport::-webkit-scrollbar-track,
  .terminal-host .xterm-viewport::-webkit-scrollbar-corner { background: #1d1c1a; }
  .terminal-host .xterm-viewport::-webkit-scrollbar-thumb { background: #514e48; border-radius: 999px; }
  .terminal-host .xterm-viewport::-webkit-scrollbar-thumb:hover { background: #706b62; }
  .terminal-host:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
  .connection-dialog { width: min(960px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); }
  .connection-dialog::backdrop { background: #0008; }
  .connection-dialog h2 { margin: 0 0 16px; font-size: 18px; }
  .connection-dialog .terminal-host { height: min(60vh, 560px); margin: 0; }
  .connection-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .conversation-option { display: flex; align-items: center; gap: 10px; padding: 12px; }
  .terminal-status { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 0 12px 8px; font-size: 12px; color: var(--text-2); }
  .terminal-status:not(:has(> :not([hidden]))) { display: none; }
  .screen-panel .typing { display: none; padding: 4px 12px; font-size: 12px; color: var(--on-accent); background: var(--accent); }
  .screen-panel.live:has(.terminal-host:focus-within) .typing { display: block; }
  .round-context { margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .round-history { display: flex; align-items: center; gap: 14px; min-width: 0; border-bottom: 1px solid var(--line); }
  .round-history > strong { flex: none; font-size: 12px; font-weight: 500; color: var(--text-3); }
  .round-list { display: flex; gap: 16px; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  .round-option { flex: none; padding: 8px 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--text-2); cursor: pointer; white-space: nowrap; }
  .round-option strong { font-size: 12px; font-weight: 500; }
  .round-option:hover { color: var(--text); }
  .round-option.current { border-bottom-color: var(--accent); color: var(--accent); }
  .round-option:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .round-option:disabled { cursor: wait; }
  .round-context-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 10px 0; cursor: pointer; list-style: none; font-size: 12px; color: var(--text-2); }
  .round-context-head::-webkit-details-marker { display: none; }
  .round-context-head:hover .round-input-label { color: var(--text); }
  .round-label { color: var(--text); font-weight: 500; }
  .round-meta { color: var(--text-3); }
  .round-expand { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); }
  .round-expand::before { content: "展开"; }
  .round-expand::after { content: ""; width: 5px; height: 5px; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: rotate(45deg) translateY(-2px); }
  .round-instruction[open] .round-expand::before { content: "收起"; }
  .round-instruction[open] .round-expand::after { transform: rotate(225deg) translate(-1px, -1px); }
  .round-prompt { max-height: min(240px, 30vh); overflow: auto; overscroll-behavior: contain; margin-bottom: 12px; padding: 12px 14px; border-radius: 6px; background: var(--surface-2); white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.7 var(--sans); }
  .followup-composer { display: flex; flex-direction: column; gap: 8px; margin: 0 0 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; }
  .followup-heading, .followup-footer { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .followup-heading { justify-content: space-between; }
  .followup-heading-info, .followup-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .followup-heading strong { font-size: 13px; font-weight: 600; }
  .followup-count, .followup-footer > span { color: var(--text-2); font-size: 12px; }
  .followup-heading .btn { font-size: 12px; padding: 3px 7px; }
  .followup-targets { display: flex; gap: 6px; max-height: 32px; overflow: auto; scrollbar-width: thin; }
  .followup-target { flex: none; max-width: 100%; padding: 3px 8px; border-radius: 5px; background: var(--accent-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .followup-composer textarea { display: block; width: 100%; min-height: 64px; max-height: min(200px, 30vh); resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); line-height: 1.6; }
  .followup-footer > span { flex: 1; }
  .followup-result { display: flex; flex-wrap: wrap; gap: 8px; color: var(--ok); font-size: 13px; }
  .followup-result.bad { color: var(--bad); }
  .icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--text-3); }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn[aria-pressed="true"] { color: var(--accent); }

  .webui-hint { color: var(--text-3); font-size: 12px; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); border-radius: 10px; padding: 9px 16px; font-size: 13px; z-index: 10; box-shadow: var(--shadow); }
  .toast.error { background: var(--bad); color: #fff; }

  /* Update news stays visible until acted on, without blocking the page or taking focus. */
  .update-notice { position: fixed; z-index: 8; right: 24px; bottom: 24px; width: min(380px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; padding: 18px; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); color: var(--text); box-shadow: 0 8px 32px #0002; }
  .update-notice-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .update-notice-head strong { font-size: 15px; font-weight: 600; }
  .update-notice-version { margin: 8px 0; overflow-wrap: anywhere; font: 12px/1.6 var(--mono); color: var(--accent); }
  .update-notice-copy, .update-notice-error { margin: 8px 0 16px; font-size: 13px; line-height: 1.6; color: var(--text-2); overflow-wrap: anywhere; }
  .update-notice-error { color: var(--bad); }
  .update-notice-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  @media (max-width: 600px) { .update-notice { right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); } }

  /* a button that asks for a second press before it acts */
  .armed, .armed:hover:not(:disabled) { background: var(--bad) !important; border-color: var(--bad) !important; color: #fff !important; }
  @media (prefers-reduced-motion: reduce) { .screen-panel { transition: none; } }
  .task-row .n.ask { color: var(--ask); }
  .sidebar-foot { padding: 10px 12px 14px; border-top: 1px solid var(--line); }
  .sidebar-foot button { width: 100%; justify-content: flex-start; }
  .nav { display: inline-flex; gap: 2px; }
  .nav .btn { padding: 4px 9px; }
  .font-size { display: inline-flex; align-items: center; gap: 2px; flex: none; }
  .font-size .btn { padding: 4px 9px; font-variant-numeric: tabular-nums; }
  .font-size .btn:nth-child(2) { min-width: 52px; justify-content: center; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { border-right: 0; }
    body.in-main .sidebar { display: none; }
    body:not(.in-main) .main { display: none; }
    .back { display: inline-block; }
    .column { padding: 4px 16px 32px; }
    .column.wide { padding-left: 16px; padding-right: 16px; }
    .round-meta { flex-basis: 100%; order: 1; }
    .followup-shortcut { font-size: 11px; }
    .hero { font-size: 28px; }
    .opt { grid-template-columns: 20px 80px 1fr; }
    .opt .st { display: none; }
    .folder { grid-template-columns: minmax(0, 1fr) auto; }
    .folder .path { display: none; }
    .folder.other .name { display: none; }
    .new-column { padding-top: 32px; }
    .new-hero { margin-bottom: 24px; }
    .service-panel { flex-wrap: wrap; }
    .screen-panel pre { height: 300px; }
    .topbar { flex-wrap: wrap; row-gap: 4px; }
  }
.agent-preparation{max-width:720px;width:90%;max-height:85vh;overflow:auto;border:1px solid var(--border,#ddd);border-radius:16px;padding:24px}.environment-agent{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--border,#ddd)}.environment-agent code{overflow-wrap:anywhere}.environment-agent label{display:flex;gap:10px;align-items:center}.environment-progress{margin:16px 0}
.identity-info{grid-column:1/-1;font-size:12px;color:var(--muted);min-width:0}.identity-info summary{cursor:pointer;width:fit-content}.identity-info p{margin:6px 0;line-height:1.6;max-width:80ch}.identity-info code{display:block;overflow-wrap:anywhere;font-size:11px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="广播任务">
    <div class="sidebar-top">
