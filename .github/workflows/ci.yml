name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Keep a main publication intact; newer PR runs may still cancel older ones.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            name: Unit
          - suite: integration
            name: Integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Run suite
        run: |
          mkdir -p test-results
          bun run test:${{ matrix.suite }} --reporter=junit --reporter-outfile=test-results/${{ matrix.suite }}.xml 2>&1 | tee test-results/${{ matrix.suite }}.log
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.suite }}-${{ github.sha }}
          path: test-results/
          retention-days: 30

  e2e:
    name: Core E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Install pinned Herdr 0.9.5
        run: |
          mkdir -p "$RUNNER_TEMP/herdr-bin"
          curl --fail --location --retry 3 --max-time 120 https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64 -o "$RUNNER_TEMP/herdr-bin/herdr"
          echo "14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d  $RUNNER_TEMP/herdr-bin/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/herdr-bin/herdr"
          echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"
      - name: Run isolated core flows
        env:
          E2E_LOG_DIR: ${{ github.workspace }}/test-results
        run: |
          mkdir -p test-results
          herdr --version
          bun run test:e2e 2>&1 | tee test-results/e2e.log
      - name: Preserve E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-e2e-${{ github.sha }}
          path: test-results/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Typecheck and validate package
        run: |
          mkdir -p test-results
          bun run build 2>&1 | tee test-results/build.log
      - name: Upload validated candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-${{ github.sha }}
          path: test-results/
          retention-days: 30

  release:
    name: Release
    needs: [tests, e2e, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-${{ github.sha }}
          path: dist/
      - name: Publish new stable version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: bun scripts/publish-release.ts
